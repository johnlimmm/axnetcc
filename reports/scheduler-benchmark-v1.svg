<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Completion-aware scheduling cuts ready-request p50 by up to 75.0 percent</title>
  <desc id="desc">Four grouped bar charts compare FIFO and last-task plus aging policies for burst 10 and burst 50 deterministic mock workloads. Ready-request completion improves while throughput is unchanged.</desc>
  <defs>
    <pattern id="fifoPattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF0F4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#6B7280" stroke-width="3"/>
    </pattern>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .headline { font-size: 27px; font-weight: 800; }
      .subtitle { font-size: 13px; fill: #68738A; }
      .chart-title { font-size: 16px; font-weight: 750; }
      .chart-unit { font-size: 11px; fill: #68738A; }
      .value { font-size: 12px; text-anchor: middle; font-weight: 700; fill: #6B7280; }
      .value.priority { fill: #4C72B0; }
      .category { font-size: 12px; text-anchor: middle; fill: #68738A; }
      .axis { stroke: #CBD1DC; stroke-width: 1; }
      .legend { font-size: 12px; fill: #68738A; }
      .footnote { font-size: 10px; fill: #68738A; }
      .panel { fill: #FFFFFF; stroke: #E1E5EC; rx: 10; }
    </style>
  </defs>
